apiVersion: apps/v1
kind: Deployment
metadata: {name: mpc-coordinator}
spec:
  replicas: 1
  selector: {matchLabels: {app: mpc-coordinator}}
  template:
    metadata: {labels: {app: mpc-coordinator}}
    spec:
      containers:
        - name: coordinator
          image: mpc-coordinator:local
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: mpc-coordinator}
spec:
  selector: {app: mpc-coordinator}
  ports: [{port: 8080, targetPort: 8080}]
